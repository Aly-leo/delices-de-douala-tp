<div class="page">
  <div class="background" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  @if (!isAuthenticated()) {
    <main class="auth-gate">
      <div class="auth-brand">
        <span class="auth-mark">&#9733;</span>
        <h1 class="auth-brand-title">{{ restaurantNom }}</h1>
        <p class="auth-brand-tagline">Guide culinaire camerounais</p>
      </div>

      @if (authMode() === 'connexion') {
        <app-connexion (basculerVersInscription)="setAuthMode('inscription')" />
      } @else {
        <app-inscription (basculerVersConnexion)="setAuthMode('connexion')" />
      }
    </main>
  } @else {
    <main class="shell">
      <app-header
        [nom]="restaurantNom"
        [ratedCount]="ratedCount()"
        [totalCount]="totalCount()"
        [averageRating]="averageRating()"
        [userDisplayName]="userDisplayName()"
        (logout)="onLogout()"
      />

      <nav class="tabs" aria-label="Navigation principale">
        <a
          class="tab"
          routerLink="/restaurants"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          Nos restaurants
        </a>
        <a
          class="tab"
          routerLink="/carte"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          La Carte
        </a>
        <a
          class="tab tab-panier"
          routerLink="/panier"
          routerLinkActive="active"
        >
          Panier
          @if (nombreArticles() > 0) {
            <span class="tab-badge" aria-label="{{ nombreArticles() }} articles">{{ nombreArticles() }}</span>
          }
        </a>
      </nav>

      <router-outlet />

      <footer class="page-footer">
        <p>© 2026 — Délices de Douala • un guide culinaire camerounais</p>
      </footer>
    </main>
  }
</div>
