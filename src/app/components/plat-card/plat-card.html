<article
  class="plat-card"
  [class.epuise]="!plat().disponible"
  [class.expanded]="expanded()"
  (click)="toggleExpanded()"
  [attr.aria-expanded]="expanded()"
>
  <div class="plat-head">
    <h3 class="plat-nom">{{ plat().nom }}</h3>
    @if (!plat().disponible) {
      <span class="badge-epuise" aria-label="Plat épuisé">Épuisé</span>
    } @else if (quantiteDansPanier() > 0) {
      <span class="badge-panier" aria-label="Déjà dans le panier">×{{ quantiteDansPanier() }}</span>
    }
  </div>

  <p class="plat-description">{{ plat().description }}</p>

  <div class="plat-meta">
    <span class="categorie">{{ plat().categorie }}</span>
    <span class="prix">{{ plat().prix | currency:'XAF':'symbol':'1.0-0' }}</span>
  </div>

  @if (expanded() && plat().disponible) {
    <button type="button" class="btn-ajouter" (click)="onAjouter($event)">
      <span class="btn-icon" aria-hidden="true">+</span>
      Ajouter au panier
    </button>
  }
</article>
