<section class="account-screen" aria-label="Connexion">
  <header class="account-head">
    <h2 class="account-title">Bienvenue</h2>
    <p class="account-subtitle">
      Connectez-vous pour accéder à Délices de Douala.
    </p>
  </header>

  <form
    class="form-container"
    (ngSubmit)="soumettre()"
    autocomplete="off"
    novalidate
  >
    <div class="form-line">
      <input
        type="email"
        name="email"
        class="input"
        placeholder="Adresse email"
        required
        [(ngModel)]="user.email"
        (input)="effacerErreur()"
      />
    </div>

    <div class="form-line">
      <input
        type="password"
        name="password"
        class="input"
        placeholder="Mot de passe"
        required
        [(ngModel)]="user.password"
        (input)="effacerErreur()"
      />
    </div>

    @if (erreur()) {
      <p class="form-error">{{ erreur() }}</p>
    }

    <div class="form-actions">
      <button
        type="submit"
        class="btn"
        [disabled]="!formulaireValide"
      >
        Se connecter
      </button>
    </div>

    <p class="form-switch">
      Pas encore de compte ?
      <button type="button" class="link" (click)="onBasculer()">
        Créer un compte
      </button>
    </p>
  </form>

  <aside class="preview">
    <h3 class="preview-title">Aperçu en direct</h3>
    <pre class="preview-json">{{ user | json }}</pre>
  </aside>
</section>
